name: ExpressCinema CI/CD

on:
  push:
    branches:
      - ci-cd

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Spring Boot application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::886728133526:role/ExpressCinemaGitHubActionsRole
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t express-cinema .

      - name: Tag Docker image
        run: |
          docker tag express-cinema:latest \
            886728133526.dkr.ecr.eu-north-1.amazonaws.com/express-cinema:latest

      - name: Push Docker image
        run: |
          docker push \
            886728133526.dkr.ecr.eu-north-1.amazonaws.com/express-cinema:latest

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c3cab58b6cff97ac" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Express Cinema" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region eu-north-1 | sudo docker login --username AWS --password-stdin 886728133526.dkr.ecr.eu-north-1.amazonaws.com",
              "sudo docker pull 886728133526.dkr.ecr.eu-north-1.amazonaws.com/express-cinema:latest",
              "sudo docker stop express-cinema || true",
              "sudo docker rm express-cinema || true",
              "sudo docker run -d --name express-cinema --restart unless-stopped -p 2025:2025 --env-file /home/ubuntu/express-cinema.env 886728133526.dkr.ecr.eu-north-1.amazonaws.com/express-cinema:latest"
            ]' \
            --region eu-north-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0c3cab58b6cff97ac" \
              --region eu-north-1 \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-0c3cab58b6cff97ac" \
                --region eu-north-1

              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out."
          exit 1
